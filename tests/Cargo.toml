[package]
name = "pandemonium-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Cross-crate acceptance tests (plan §4, §13)"

# This package exists so the acceptance tests named by the plan (tests/determinism.rs
# for A1, etc.) compile at the workspace root — cargo needs a package to build test
# targets. It is the acceptance host only: exempt from the internal dependency law
# (plan §4), still subject to the forbidden-crate list. See docs/ASSUMPTIONS.md A-002.

[dependencies]
pandemonium-fx = { path = "../crates/fx" }
pandemonium-sim = { path = "../crates/sim" }
pandemonium-sim-api = { path = "../crates/sim_api" }
pandemonium-replay = { path = "../crates/replay" }
pandemonium-content = { path = "../crates/content" }
# The AI acceptance suite (M7) drives controller-hosted matches through the
# engine's hosting loop — the same one the tools use (A-063).
pandemonium-engine = { path = "../crates/engine" }
pandemonium-ai = { path = "../crates/ai" }

[dev-dependencies]
# A11's command-parity fuzz (plan §13: "Property test: same command from
# 'player' and 'AI' issuer produces same outcome"). Allowed for this package
# by the external allow-list; test-only, never ships.
proptest = "1"

[[test]]
name = "architecture_law"
path = "architecture_law.rs"

[[test]]
name = "determinism"
path = "determinism.rs"
[[test]]
name = "content_pipeline"
path = "content_pipeline.rs"

[[test]]
name = "movement"
path = "movement.rs"

[[test]]
name = "economy"
path = "economy.rs"

[[test]]
name = "combat"
path = "combat.rs"

[[test]]
name = "vision"
path = "vision.rs"

[[test]]
name = "ai"
path = "ai.rs"

[[test]]
name = "match_rules"
path = "match_rules.rs"

[[test]]
name = "alpha_loop"
path = "alpha_loop.rs"
