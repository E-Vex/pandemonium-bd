# cargo-audit configuration (B-002 Part 2 triage; A-021 revision).
#
# The audit workflow runs `cargo audit --deny warnings`, which fails on
# advisory *warnings* (unmaintained/informational) as well as real
# vulnerabilities. As of A-021 the lockfile has ZERO vulnerability
# advisories, and the former RUSTSEC-2024-0436 ignore is DELETED:
# wgpu 26.0.1 -> wgpu-hal -> metal 0.32.0 -> paste 1.0.15 left the
# lockfile entirely with the wgpu 30 bump (the Apple stack is
# objc2-metal now; `paste` appears in no target's tree), so there is
# nothing left to ignore — exactly DEBT-200's declared repayment path.
#
# The one remaining unmaintained notice (informational, not a
# vulnerability):
#
# 1. RUSTSEC-2026-0192 - ttf-parser 0.25.1 (unmaintained, informational):
#    transitive via fontdue 0.9.5 (client text rasterization) and via
#    winit 0.30.13 -> sctk-adwaita -> ab_glyph -> owned_ttf_parser. No
#    fixed version exists within the current winit/fontdue generations.
#    Revisit on the next winit or fontdue bump (DEBT-200's remaining
#    half).
#
# This ignore is the documented disposition - not a silence: the file is
# reviewed in git, and any NEW advisory (vulnerability or otherwise)
# still fails the workflow.
[advisories]
ignore = [
    "RUSTSEC-2026-0192",
]
