[package]
name = "pandemonium-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The playable binary: wgpu renderer, winit window, screens, HUD, audio stub"

[dependencies]
pandemonium-fx = { path = "../fx" }
pandemonium-sim = { path = "../sim" }
pandemonium-sim-api = { path = "../sim_api" }
pandemonium-content = { path = "../content" }
pandemonium-ai = { path = "../ai" }
pandemonium-replay = { path = "../replay" }
pandemonium-engine = { path = "../engine" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
# PNG decoding for the client-side asset pack's entity textures
# (ADR-0001's presentation tree): default features are off so only the
# png decoder rides along — no image-format zoo, no rayon.
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
# glTF 2.0 binary parsing for the pack's static entity models
# (ADR-0101): parse-only — no fs import (that would pull base64,
# image, urlencoding), `names` for the team_color material lookup.
gltf = { version = "1.4", default-features = false, features = ["names"] }
pollster = "0.4"
ron = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
wgpu = "26"
winit = "0.30"
glam = "0.30"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
