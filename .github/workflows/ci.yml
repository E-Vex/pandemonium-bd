name: ci

# The green gate (plan §0/AI-Handoff §4) on every push and pull request:
#   1. fmt --check (formatting)
#   2. clippy -D warnings (zero tolerance)
#   3. tests in dev AND release on Linux, Windows, and macOS — determinism must
#      hold in release and across platforms (plan §5.6, A1)
#   4. replay round-trip: record a scripted headless match, verify it — A2
# The toolchain is pinned by rust-toolchain.toml (1.98.1); rustup installs it
# automatically on first use.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # A hang must fail loudly, not consume the runner hour (nightly's rule).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      # clippy checks every workspace member, and the client's rodio -> cpal ->
      # alsa-sys build script probes pkg-config for alsa even under `cargo
      # check` — ubuntu-latest runners ship no libasound2-dev (run #41's clippy
      # failure: "The system library `alsa` required by crate `alsa-sys` was
      # not found"). macOS (CoreAudio) and Windows (WASAPI) need no system lib.
      - name: Linux system deps (ALSA dev for the client's audio stack)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (zero tolerance)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # The green gate (plan §0/AI-Handoff §4) on every push and pull request:
    name: tests (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    # A hang must fail loudly, not consume the runner hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      # Only the Linux legs build the client binary (rodio -> cpal -> alsa-sys
      # needs libasound2-dev); the Windows legs fail for a different, known
      # reason (the client test binary's STATUS_ACCESS_VIOLATION, filed for
      # the client's lane) and the macOS legs need no system audio lib.
      - name: Linux system deps (ALSA dev for the client's audio stack)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
      - name: Run the test suite
        run: cargo test --workspace ${{ matrix.profile == 'release' && '--release' || '' }}

  replay:
    # A2: a recorded match replays to an identical final hash (plan §13).
    name: replay round-trip (A2)
    runs-on: ubuntu-latest
    # A hang must fail loudly, not consume the runner hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: replay-${{ hashFiles('Cargo.lock') }}
      - name: Record and verify a scripted match
        run: |
          cargo run -p pandemonium-tools -- headless --seed 7 --ticks 300 --record ci-replay.pdrp
          cargo run -p pandemonium-tools -- replay-verify ci-replay.pdrp
      - name: Record and verify an AI-vs-AI match (M7)
        run: |
          cargo run -p pandemonium-tools -- headless --seed 7 --ticks 1200 --p1 ai --p2 ai --record ci-ai-replay.pdrp
          cargo run -p pandemonium-tools -- replay-verify ci-ai-replay.pdrp

  binaries:
    name: workspace builds and runs
    runs-on: ubuntu-latest
    # A hang must fail loudly, not consume the runner hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      # `cargo run -p pandemonium-client` builds and links the client binary —
      # rodio -> cpal -> alsa-sys needs libasound2-dev (run #41's binaries
      # failure). On the headless runner the client takes its documented
      # no-display fallback: the headless smoke pass over the real content.
      - name: Linux system deps (ALSA dev for the client's audio stack)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: binaries-${{ hashFiles('Cargo.lock') }}
      - name: "Every binary starts (plan §0 - the game must build and run)"
        run: |
          cargo run -p pandemonium-tools -- headless --seed 1 --ticks 30
          cargo run -p pandemonium-tools -- headless --seed 1 --ticks 60 --p1 ai --p2 ai
          cargo run -p pandemonium-client
