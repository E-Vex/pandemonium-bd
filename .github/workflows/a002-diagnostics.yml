name: a002-diagnostics

# A-002 Part 1.1: the Windows-crash isolation workflow (TEMPORARY by design —
# deleted before the final delivery; the findings live on in
# docs/product/WINDOWS_CI_CRASH.md).
#
# What this run answers, in order:
#   1. process-start vs in-test      (--help and --list on the raw test binary)
#   2. which test, exactly           (every test one at a time, RUST_BACKTRACE=full)
#   3. serial vs parallel            (the whole suite with --test-threads=1)
#   4. wgpu / rodio ruled in or out  (the hardware gate deliberately OPEN:
#                                     PANDEMONIUM_HW_TESTS=1 runs the adapter
#                                     enumeration and the real audio probe on
#                                     this very runner)
#   5. the fix's claim               (PANDEMONIUM_AUDIO_PROBE=0 + the canaries)
#
# windows-latest deliberately matches ci.yml's failing legs (the crash must
# be reproduced in the same environment, not a pinned one).

on:
  push:
    branches: ["a/A-002-*"]

jobs:
  isolate:
    name: isolate the Windows crash (client test binary)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: a002-diag-${{ hashFiles('Cargo.lock') }}
      - name: Build the client test binary
        run: cargo test -p pandemonium-client --no-run

      - name: "1. Process-start discriminator (--help / --list on the raw binary)"
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          echo "test binary: $BIN"
          "$BIN" --help; echo "HELP_EXIT=$?"
          "$BIN" --list | head -8; echo "LIST_EXIT=$?"
          # If either of these dies with 0xC0000005, the crash is at process
          # start/exit (before or after any test) — that is the answer.

      - name: "2. Every test, one at a time (RUST_BACKTRACE=full per run)"
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --list --format=terse | sed 's/: test$//' | grep -v '^$' > tests.txt
          wc -l tests.txt
          crash=0
          : > one-at-a-time-results.txt
          while IFS= read -r t; do
            "$BIN" --exact "$t" --test-threads=1 > "out-$$.log" 2>&1
            code=$?
            printf '%s -> exit %s\n' "$t" "$code" >> one-at-a-time-results.txt
            if [ "$code" -ne 0 ] && [ "$code" -ne 101 ]; then
              crash=1
              echo "=== CRASH CANDIDATE: $t (exit $code) ==="
              cat "out-$$.log"
              cp "out-$$.log" "crash-$$.log"
            fi
          done < tests.txt
          echo "--- summary (nonzero exits) ---"
          grep -v 'exit 0$' one-at-a-time-results.txt || true
          echo "--- counts ---"
          grep -c 'exit 0$' one-at-a-time-results.txt || true
          rm -f "out-$$.log"
          [ "$crash" -eq 0 ] || { echo "at least one test crashed the process"; }
          # Never fail the job here: the results file IS the finding.

      - name: "3. The whole suite, serial (--test-threads=1)"
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --test-threads=1 > serial.log 2>&1
          code=$?
          echo "SERIAL_EXIT=$code"
          tail -20 serial.log

      - name: "4. The hardware gate deliberately OPEN (canaries live on this runner)"
        shell: bash
        env:
          PANDEMONIUM_HW_TESTS: "1"
        run: |
          set -uo pipefail
          echo "gate open: wgpu adapter enumeration + the real rodio probe run NOW,"
          echo "on this GPU-less, endpoint-less runner. If the process dies here,"
          echo "the log above this line names the call that killed it."
          cargo test -p pandemonium-client -- --nocapture wgpu_adapter_enumeration the_device_probe
          echo "CANARY_EXIT=$?"

      - name: "4b. The full suite with the gate open (the definitive discriminator)"
        shell: bash
        env:
          PANDEMONIUM_HW_TESTS: "1"
        run: |
          set -uo pipefail
          cargo test -p pandemonium-client -- --nocapture --test-threads=1 > gate-open.log 2>&1
          code=$?
          echo "GATE_OPEN_EXIT=$code"
          tail -25 gate-open.log

      - name: "5. The fix's claim (probe off; audio wiring still green)"
        shell: bash
        env:
          PANDEMONIUM_AUDIO_PROBE: "0"
        run: |
          set -uo pipefail
          cargo test -p pandemonium-client -- --nocapture audio_wiring
          echo "AUDIO_OFF_EXIT=$?"

      - name: Upload every result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a002-diag-results
          path: |
            one-at-a-time-results.txt
            crash-*.log
            serial.log
            gate-open.log
