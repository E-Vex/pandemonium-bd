name: a002-diagnostics

# A-002 Part 1, ROUND 2: the interaction matrix (TEMPORARY by design —
# deleted before the final delivery; findings live in
# docs/product/WINDOWS_CI_CRASH.md).
#
# Round 1 (run 38049622201) established, on this same runner class:
#   - process start/exit: clean        (--help / --list exit 0)
#   - every test alone (gate closed):  exit 0 x194
#   - whole suite, serial, closed:     194/194, exit 0
#   - canaries alone (gate open):      both pass — wgpu adapter answers
#                                      (WARP), rodio probe finds no device
#   - whole suite, serial, gate OPEN:  exit 139 — dies in
#                                      sound::tests::the_no_device_constructor
#                                      _takes_the_null_arm_without_panicking,
#                                      i.e. inside Sound::new's REAL probe,
#                                      AFTER the canary probe + the wgpu
#                                      adapter request ran earlier.
#   - master (pre-fix) crashed with 5 probes in parallel and NO wgpu use.
#
# Round 2, attempt 1 (run 38050523384) validated M1a/M1b/M1c (each hardware
# cell alone exits 0) but M2/M3 died on a harness CLI error —
# "Option 'exact' given more than once" (the filters must be positional
# under ONE --exact), and the runner's default bash -e aborted the step
# chain, starving M4/M5. Attempt 2 fixes both: single --exact with two
# positional filters, set +e in every script, if: always() on every cell.
#
# The discriminating hypotheses:
#   H-count: >=2 real rodio WASAPI probe rounds in ONE process crash it
#            (master: 5 probes -> crash; branch default: 1 -> green;
#             gate-open: 2 -> crash).
#   H-order: a wgpu adapter request BEFORE the probe poisons the process
#            (gate-open ordering).
# The product's own startup is 1 probe THEN wgpu (main.rs: probe at line
# ~195, GPU in the event loop) — a different shape than both hypotheses,
# emulated directly by cell M5.
#
# Every cell captures its exit code and NEVER fails the job — a crash IS
# the measurement. windows-latest matches ci.yml's legs.
on:
  push:
    branches: ["a/A-002-*"]
  workflow_dispatch:

jobs:
  matrix:
    name: the probe/wgpu interaction matrix (client test binary)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
      PANDEMONIUM_HW_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: a002-diag2-${{ hashFiles('Cargo.lock') }}
      - name: Build the client test binary and the client itself
        run: |
          cargo test -p pandemonium-client --no-run
          cargo build -p pandemonium-client
      - name: "M1a. audio canary alone (one probe, gate open)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --exact "sound::tests::the_device_probe_runs_behind_the_hardware_gate" --test-threads=1 --nocapture > m1a.log 2>&1
          echo "M1A_EXIT=$?" | tee -a m1a.log
      - name: "M1b. Sound::new probe alone (the round-1 crash site, gate open)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --exact "sound::tests::the_no_device_constructor_takes_the_null_arm_without_panicking" --test-threads=1 --nocapture > m1b.log 2>&1
          echo "M1B_EXIT=$?" | tee -a m1b.log
      - name: "M1c. wgpu adapter request alone (gate open)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --exact "render::tests::wgpu_adapter_enumeration_runs_behind_the_hardware_gate" --test-threads=1 --nocapture > m1c.log 2>&1
          echo "M1C_EXIT=$?" | tee -a m1c.log
      - name: "M2. TWO probes, no wgpu (canary then Sound::new; H-count)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          # Two positional filters under ONE --exact (libtest rejects a
          # repeated --exact flag — round-2 attempt 1's lesson).
          "$BIN" --exact "sound::tests::the_device_probe_runs_behind_the_hardware_gate" "sound::tests::the_no_device_constructor_takes_the_null_arm_without_panicking" --test-threads=1 --nocapture > m2.log 2>&1
          echo "M2_EXIT=$?" | tee -a m2.log ; tail -8 m2.log
      - name: "M3. wgpu request then ONE probe (H-order)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --exact "render::tests::wgpu_adapter_enumeration_runs_behind_the_hardware_gate" "sound::tests::the_no_device_constructor_takes_the_null_arm_without_panicking" --test-threads=1 --nocapture > m3.log 2>&1
          echo "M3_EXIT=$?" | tee -a m3.log ; tail -8 m3.log
      - name: "M4. reproduce round 1: whole suite, serial, gate open"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          BIN=$(ls target/debug/deps/pandemonium_client-*.exe 2>/dev/null | grep -v '\.d$' | head -1)
          "$BIN" --test-threads=1 --nocapture > m4.log 2>&1
          echo "M4_EXIT=$?" | tee -a m4.log ; tail -8 m4.log
      - name: "M5. the PRODUCT's own sequence: windowed client on this runner"
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          set -uo pipefail ; set +e
          # The real binary, the real startup order: content -> Sound::new
          # probe (null arm here: no endpoint) -> EventLoop -> wgpu init on
          # WARP -> 30 presented frames -> clean exit. This is exactly the
          # "weird GPU (software adapter answers), no audio endpoint" player
          # class the brief names, run end-to-end.
          target/debug/pandemonium-client.exe --content content --frames 30 > m5.log 2>&1
          echo "M5_EXIT=$?" | tee -a m5.log ; tail -15 m5.log
      - name: "Verdict table"
        if: always()
        shell: bash
        run: |
          set -uo pipefail ; set +e
          echo "cell | exit" ; echo "-----+-----"
          for m in m1a m1b m1c m2 m3 m4 m5; do
            e=$(grep -oE "M[0-9][A-C]?_EXIT=[0-9]+" $m.log | tail -1)
            echo "$m | ${e:-NO_MARKER}"
          done
          echo ""
          echo "Interpretation: M2 nonzero + M3 zero => H-count (>=2 probes)."
          echo "M3 nonzero + M2 zero => H-order (wgpu poisons the probe)."
          echo "M5 is the product verdict regardless of which hypothesis"
          echo "holds: zero = the shipped startup sequence is clean on this"
          echo "machine class; nonzero = player-visible defect, A-002 must"
          echo "declare it and mitigate."
      - name: Upload every result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a002-diag2-results
          path: |
            m1a.log
            m1b.log
            m1c.log
            m2.log
            m3.log
            m4.log
            m5.log
