name: nightly

# The A7 acceptance gate (plan §12, §13): a nightly soak of seeded AI-vs-AI
# matches — no panics, no stuck matches, no invariant violations, win-rate
# telemetry — plus the plan §15 performance budgets in release.
#
# The tier semantics (the A12 checker is debug-only by design, plan §13):
#   * The release tiers (smoke + the 1000-match shards) are the
#     panics/stuck/resolution/throughput sweep — `tools soak` isolates a
#     panicking match per-match (counts it, attributes the seed, keeps the
#     report) and exits non-zero at the end when anything crashed.
#   * The dev tier (soak-dev) is the invariant sweep: a dev-profile soak
#     runs the A12 checker inside every tick, and the same per-match
#     isolation turns a violation into a counted crash with its seed
#     instead of an aborted run — the only way a violation is observable
#     at soak scale at all.
#
# The 1000-match count from A7 runs nightly rather than per-push: at Alpha
# sizes a full sweep takes hours, and CI-per-push is the green gate's job
# (ci.yml). Crashes fail the workflow (`tools soak` exits non-zero when any
# match crashes or panics).
#
# M10.1 — sharding, timeouts, and evidence artifacts (plan §12's "in parallel
# processes" is satisfied at the process level, exactly as the plan words it:
# the soak binary itself stays sequential — the sequential runner is the
# tested artifact):
#   * The 1000-match tier is a 10-job matrix, 100 matches per shard.
#   * Every job carries a timeout-minutes — a hang must fail loudly, not
#     consume the runner day.
#   * Every shard tees its summary to a file and uploads it; an aggregate
#     job concatenates the evidence, sums the win totals, and fails if any
#     shard's `crashed` count is nonzero.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  # Manual trigger for on-demand sweeps. `shard_matches` shrinks the ten
  # release shards for a small dispatch (the scheduled default stays 100 =
  # the full 1000-match A7 tier); the smoke tier and the dev invariant tier
  # keep their own sizes regardless. Seeds stay disjoint for any per-shard
  # count <= 100 (the sharding arithmetic note below still holds: shard k's
  # seeds are [BASE + 100k, BASE + 100k + count), and 100-wide spacing keeps
  # the intervals disjoint).
  workflow_dispatch:
    inputs:
      shard_matches:
        description: "Matches per release shard (scheduled default: 100)"
        required: false
        default: "100"

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: soak (${{ matrix.tier }})
    runs-on: ubuntu-latest
    # A hang must fail loudly, not consume the runner day.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Sharding arithmetic (the disjoint-seeds proof):
        #
        #   BASE is derived exactly as before M10.1: day index * 1000.
        #   Shard k (k = 0..9) runs `--matches 100 --seed-base BASE + 100k`,
        #   and `tools soak` assigns seed `seed_base + i` to match i,
        #   i = 0..99 — so shard k's seeds are exactly the half-open
        #   interval [BASE + 100k, BASE + 100k + 100).
        #
        #   Two shards k < j differ by (j - k) * 100 >= 100, so their
        #   100-wide intervals cannot overlap: the shards are disjoint by
        #   construction. The union over k = 0..9 is [BASE, BASE + 1000) —
        #   the same 1000 consecutive seeds the unsharded
        #   `--matches 1000 --seed-base BASE` run covered, so the sharded
        #   nightly proves what the sequential nightly proved.
        #
        #   The smoke tier keeps its pre-M10.1 seed base (BASE itself); its
        #   seeds overlap shard 0's first 32 — as they did with the
        #   unsharded 1000-match tier before it. It is cheap crash/stall
        #   detection on fresh runners, not a coverage claim.
        include:
          # The smoke tier always runs: cheap crash/stall detection.
          - tier: smoke-32
            matches: 32
            seed_offset: 0
            timeout: 30
          # The full A7 tier, sharded 10 ways. The per-shard match count is
          # dispatch-shrinkable (workflow_dispatch input, scheduled default
          # 100); on schedule and default dispatches this is exactly 100.
          - tier: shard-0
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 0
            timeout: 90
          - tier: shard-1
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 100
            timeout: 90
          - tier: shard-2
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 200
            timeout: 90
          - tier: shard-3
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 300
            timeout: 90
          - tier: shard-4
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 400
            timeout: 90
          - tier: shard-5
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 500
            timeout: 90
          - tier: shard-6
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 600
            timeout: 90
          - tier: shard-7
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 700
            timeout: 90
          - tier: shard-8
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 800
            timeout: 90
          - tier: shard-9
            matches: ${{ inputs.shard_matches || '100' }}
            seed_offset: 900
            timeout: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: soak-${{ matrix.tier }}-${{ hashFiles('Cargo.lock') }}
      - name: Build (release — soak is throughput-bound)
        run: cargo build --release -p pandemonium-tools
      - name: Soak (${{ matrix.tier }} — ${{ matrix.matches }} AI-vs-AI matches)
        run: |
          set -o pipefail
          BASE=$(( $(date +%s) / 86400 * 1000 ))
          cargo run --release -p pandemonium-tools -- soak \
            --matches ${{ matrix.matches }} \
            --seed-base $(( BASE + ${{ matrix.seed_offset }} )) \
            --content content \
            | tee soak-${{ matrix.tier }}.txt
      - name: Upload the shard summary (evidence)
        # Upload even on failure — a crashing shard's summary is exactly
        # the evidence the aggregate and the declaration want to see.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.tier }}
          path: soak-${{ matrix.tier }}.txt

  # The dev tier: the A12 invariant sweep. The A12 checker is
  # #[cfg(debug_assertions)] (plan §13's letter — it runs inside every
  # Sim::step in debug builds), so only this tier observes invariant
  # violations at soak scale. The per-match panic isolation in `tools soak`
  # is what makes this tier possible at all: pre-isolation, the first
  # violation aborted the run and destroyed the night's evidence. Sixteen
  # rotating matches a night (dev is an order of magnitude slower than
  # release; 16 keeps the job comfortably inside its timeout while
  # sweeping ~240 fresh seeds a month through the checker).
  soak-dev:
    name: soak-dev (A12 invariant sweep, dev profile)
    runs-on: ubuntu-latest
    # A hang must fail loudly, not consume the runner day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: soak-dev-${{ hashFiles('Cargo.lock') }}
      - name: Build (dev — the A12 checker is debug-only)
        run: cargo build -p pandemonium-tools
      - name: Soak (16 AI-vs-AI matches under the A12 checker)
        run: |
          set -o pipefail
          BASE=$(( $(date +%s) / 86400 * 1000 ))
          cargo run -p pandemonium-tools -- soak \
            --matches 16 \
            --seed-base $BASE \
            --content content \
            | tee soak-dev.txt
      - name: Upload the dev-tier summary (evidence)
        # Upload even on failure — a crashing tier's summary is exactly
        # the evidence the aggregate and the declaration want to see.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-dev
          path: soak-dev.txt

  aggregate:
    name: aggregate (evidence + crashed gate)
    # Needs every tier (the release shards and the dev invariant sweep)
    # and runs even when one of them failed — `!cancelled()` keeps the
    # evidence landing on exactly the failure paths it exists for (a
    # plain `needs:` skips dependents on failure, which would drop the
    # concatenation and the crashed gate precisely when a tier crashed).
    if: ${{ !cancelled() }}
    needs: [soak, soak-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download every shard summary
        uses: actions/download-artifact@v4
        with:
          path: soak-summaries
          pattern: soak-*
          merge-multiple: true
      - name: Concatenate the evidence, sum the totals, gate on crashed
        run: |
          set -euo pipefail
          cd soak-summaries
          # One durable artifact: the whole night's soak evidence.
          cat $(ls | sort) > ../soak-all.txt
          # The gate: any nonzero `crashed` count in any shard fails the
          # nightly (belt and braces — the tool already exits non-zero on
          # a crash, this catches a regression in that contract too).
          total_crashed=0
          for f in *; do
            crashed=$(grep -E '^  crashed:' "$f" | grep -oE '[0-9]+' | head -1)
            crashed=${crashed:-0}
            echo "  $f: crashed $crashed"
            total_crashed=$(( total_crashed + crashed ))
          done
          if [ "$total_crashed" -ne 0 ]; then
            echo "::error::soak tiers reported $total_crashed crashed match(es)"
            exit 1
          fi
          # Win-rate totals, summed across the tiers' `resolved:` lines
          # (the dev tier's 16 matches included — the label says tiers,
          # not shards, because the dev sweep adds its own sample).
          # Each line carries five numbers: resolved, "0", wins0, "1", wins1.
          grep -h '^  resolved:' * | grep -oE '[0-9]+' | awk '
            NR % 5 == 1 { resolved += $1 }
            NR % 5 == 3 { wins0 += $1 }
            NR % 5 == 0 { wins1 += $1 }
            END {
              printf "  matches resolved: %d (player 0: %d, player 1: %d)\n", \
                resolved, wins0, wins1
            }'
          echo "aggregate: 0 crashed across all tiers (release shards + dev invariant sweep)"
      - name: Upload the concatenated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-aggregate
          path: soak-all.txt

  bench:
    name: bench (§15 perf budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ hashFiles('Cargo.lock') }}
      - name: Build (release)
        run: cargo build --release -p pandemonium-tools
      - name: "Bench (plan §15 budgets: ≤ 1 ms avg, ≤ 4 ms p99, ≥ 1000 t/s)"
        run: cargo run --release -p pandemonium-tools -- bench --ticks 10000 --content content
