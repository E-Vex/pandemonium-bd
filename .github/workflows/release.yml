name: release

# A-002 Part 2.3: distributable builds.
#
#   tag v*        -> build + package + smoke on 3 OSes, then publish a GitHub
#                    PRE-RELEASE with per-OS archives and SHA-256 checksums
#                    (the PM triggers tags; this workflow never pushes one)
#   dispatch      -> the same build/package/smoke, artifacts only, nothing
#                    published (the dry-run channel for the A14 playtest)
#
# The licence gate (cargo-deny, docs/product/deny.toml) runs in parallel
# with the builds: a licence outside the allow-list fails the run — and it
# BLOCKS PUBLISHING (publish needs licence-gate), but artifacts are still
# produced for inspection. THIRD_PARTY_NOTICES.md is generated by cargo-about
# from the same tree (docs/product/about.toml) and rides in every archive.
#
# Runner images are pinned explicitly (B-002's rule — reproducible legs):
#   ubuntu-24.04  -> x86_64-unknown-linux-gnu
#   windows-2022  -> x86_64-pc-windows-msvc
#   macos-15      -> aarch64-apple-darwin (Apple silicon)
#
# Windows binaries carry the .exe suffix (EXT below); checksums use
# sha256sum where it exists and shasum -a 256 elsewhere (macOS).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # pre-release creation on tags (the PM's trigger)

env:
  CARGO_TERM_COLOR: always

jobs:
  licence-gate:
    name: dependency licence gate (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install cargo-deny 0.20.2 (pinned)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny ~/.cargo/bin/
      - name: Check the licence allow-list (deny.toml)
        run: cargo deny --config docs/product/deny.toml check licenses

  notices:
    name: third-party notices (cargo-about)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install cargo-about 0.9.2 (pinned)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about ~/.cargo/bin/
      - name: Generate THIRD_PARTY_NOTICES.md
        shell: bash
        run: |
          set -euo pipefail
          # Header + the embedded font's licence + cargo-about's inventory,
          # our own crates filtered out (they are ours, not third-party).
          cargo about generate -c docs/product/about.toml docs/product/about.hbs > notices-crates.md
          {
            cat <<'HDR'
          # Third-party notices

          This archive ships the Pandemonium game binaries, its data tree, and fonts
          and libraries built by third parties. Their licence terms follow, with the
          list of crates each licence covers. The project's own licence is not stated
          here (pending the owner's decision).

          ## The embedded font — Pandemonium Sans

          The client embeds a font rasterized at runtime: "Pandemonium Sans", an ASCII
          subset of DejaVu Sans (renamed as the licence requires). Its full licence
          text follows verbatim.

          HDR
            cat crates/client/assets/fonts/LICENSE.txt
            echo
            cat <<'HDR2'

          ---

          ## Dependency licences

          Generated by cargo-about from the workspace lockfile (docs/product/about.toml
          selects what appears; docs/product/deny.toml gates what is ALLOWED — a
          stricter list). Our own workspace crates are omitted from the lists below.

          HDR2
            python3 - notices-crates.md <<'PY'
          import re, sys
          raw = open(sys.argv[1]).read()
          sections = re.split(r'(?m)^(?=## )', raw)
          kept = []
          for s in sections:
              if s.startswith('## '):
                  s = re.sub(r' pandemonium-[a-z-]+ [0-9.]+;', '', s)
                  if re.search(r'^Used by:\s*$', s, flags=re.M):
                      continue
              kept.append(s)
          sys.stdout.write(''.join(kept))
          PY
          } > THIRD_PARTY_NOTICES.md
          test -s THIRD_PARTY_NOTICES.md
          grep -q 'Pandemonium Sans' THIRD_PARTY_NOTICES.md
      - name: Upload the notices
        uses: actions/upload-artifact@v4
        with:
          name: release-notices
          path: THIRD_PARTY_NOTICES.md

  build:
    name: build + package (${{ matrix.slug }})
    needs: notices
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            ext: ".exe"
          - os: macos-15
            target: aarch64-apple-darwin
            slug: macos-aarch64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Linux system deps (ALSA dev for the client's audio stack)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.slug }}-${{ hashFiles('Cargo.lock') }}
      - name: Build the client and tools (release)
        run: cargo build --release -p pandemonium-client -p pandemonium-tools --target ${{ matrix.target }}
      - name: The version stamp (evidence)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/pandemonium-client${{ matrix.ext }}" --version
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="git-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pkg=pandemonium-$V-${{ matrix.slug }}" >> "$GITHUB_OUTPUT"
      - name: Assemble the archive tree
        shell: bash
        env:
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          PKG="${{ steps.ver.outputs.pkg }}"
          rm -rf staging && mkdir -p "staging/$PKG"
          cp "target/${{ matrix.target }}/release/pandemonium-client${BIN_EXT}" "staging/$PKG/"
          cp "target/${{ matrix.target }}/release/pandemonium-tools${BIN_EXT}" "staging/$PKG/"
          cp -r content "staging/$PKG/content"
          cp README.md "staging/$PKG/"
          cp docs/product/QUICKSTART.md "staging/$PKG/QUICKSTART.md"
          # The Linux archive's README states its runtime dependency (the
          # in-repo README is OS-neutral; the archive is what a player holds).
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cat >> "staging/$PKG/README.md" <<'EOF'

          ## Runtime dependency (Linux)

          This build needs `libasound2` (ALSA) present at load time. Without it
          the process cannot start at all (the dynamic loader refuses before
          the game's own silent no-audio fallback can engage); with it, audio
          either works or degrades honestly — never a crash. See QUICKSTART.md
          for the per-distribution install commands.
          EOF
          fi
      - name: Download the notices
        uses: actions/download-artifact@v4
        with:
          name: release-notices
          path: notices-dl
      - name: Place the notices + create the archive + checksum
        shell: bash
        env:
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          PKG="${{ steps.ver.outputs.pkg }}"
          cp notices-dl/THIRD_PARTY_NOTICES.md "staging/$PKG/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'staging/$PKG' -DestinationPath '$PKG.zip' -Force"
            ARCHIVE="$PKG.zip"
          else
            tar -czf "$PKG.tar.gz" -C staging "$PKG"
            ARCHIVE="$PKG.tar.gz"
          fi
          # sha256sum where it exists; shasum elsewhere (macOS).
          HASH=$(sha256sum "$ARCHIVE" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          echo "$HASH  $ARCHIVE" | tee "$ARCHIVE.sha256"
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: |
            pandemonium-*-${{ matrix.slug }}.zip
            pandemonium-*-${{ matrix.slug }}.tar.gz
            pandemonium-*-${{ matrix.slug }}.zip.sha256
            pandemonium-*-${{ matrix.slug }}.tar.gz.sha256

  smoke:
    # A-002 Part 2.5: the packaged artifact must run from a CLEAN directory
    # on its own OS — unpack, run the client's headless smoke and the tools'
    # content-validate against the packaged content, verify the checksum.
    # (The headless path returns before the audio probe and the GPU stack,
    # so this is the content/packaging canary, not the hardware one — the
    # product-level probe-on-endpoint-less-Windows proof was the A-002
    # diagnostics matrix, cell M5.)
    name: packaged-archive smoke (${{ matrix.slug }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x86_64
            ext: ""
          - os: windows-2022
            slug: windows-x86_64
            ext: ".exe"
          - os: macos-15
            slug: macos-aarch64
            ext: ""
    steps:
      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.slug }}
      - name: Unpack into a clean directory and smoke it
        shell: bash
        env:
          BIN_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          CLEAN="$RUNNER_TEMP/pandemonium-smoke-clean"
          rm -rf "$CLEAN" && mkdir -p "$CLEAN"
          # A bare `ls` cannot exit nonzero; the previous two-pattern form
          # (`ls pandemonium-*.tar.gz pandemonium-*.zip`) killed this step on
          # every OS — each OS ships exactly one archive type, and the
          # unmatched literal made ls exit 2 under pipefail before the
          # assignment could land. (Run 38051964535's three smoke
          # failures: this line, never the archives.)
          ARCHIVE=$(ls | grep -E '^pandemonium-.*\.(tar\.gz|zip)$' | head -1)
          [ -n "$ARCHIVE" ] || { echo "no archive in $(pwd):"; ls -la; exit 1; }
          if [[ "$ARCHIVE" == *.zip ]]; then
            powershell.exe -NoProfile -Command "Expand-Archive -Path '$ARCHIVE' -DestinationPath '$CLEAN' -Force" ||
              unzip -q "$ARCHIVE" -d "$CLEAN"
          else
            tar -xzf "$ARCHIVE" -C "$CLEAN"
          fi
          PKG_DIR=$(ls -d "$CLEAN"/pandemonium-*/ | head -1)
          # 1. the packaged client's headless smoke pass
          "$PKG_DIR/pandemonium-client${BIN_EXT}" --headless
          # 2. the packaged tools validate the packaged content
          (cd "$PKG_DIR" && "./pandemonium-tools${BIN_EXT}" content-validate)
          # 3. the archive is what the checksum recorded
          expected=$(awk '{print $1}' "$ARCHIVE.sha256")
          actual=$(sha256sum "$ARCHIVE" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          [ "$expected" = "$actual" ] || { echo "checksum mismatch: $ARCHIVE"; exit 1; }
          echo "SMOKE PASS: $ARCHIVE"

  publish:
    # Only on a tag push (the PM's trigger — this workflow never pushes one).
    # Publishing needs EVERY gate green: licence gate, builds, smokes.
    name: GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [licence-gate, build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Consolidated checksums + the pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f checksums.txt
          # Collect the archives with the [ -e ] guard (a bare glob in the
          # gh command line would pass the unmatched literal through and
          # fail the release on any OS mix that lacks one archive type).
          FILES=()
          for archive in pandemonium-*.tar.gz pandemonium-*.zip; do
            [ -e "$archive" ] || continue
            sha256sum "$archive" >> checksums.txt
            FILES+=("$archive")
          done
          cat checksums.txt
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --prerelease \
            --title "Pandemonium $TAG (Alpha playtest)" \
            --notes "Unsigned Alpha build. Start with QUICKSTART.md (Gatekeeper/SmartScreen bypass, controls, troubleshooting). Verify a download against checksums.txt. Audio degrades silently without a device; Linux needs libasound2." \
            "${FILES[@]}" checksums.txt
